<div class="shift-cards">
  @for (shift of shiftOrder; track shift) {
    <div class="card card-{{ cards?.[shift]?.color || 'orange' }}">
      <div class="total">{{ cards?.[shift]?.total ?? 0 }}</div>
      <div class="shift-name">{{ shift }}</div>
      <div class="username">{{ cards?.[shift]?.username || '-' }}</div>
      <div class="dept">{{ department }} DEPARTMENT</div>
      @if (cards?.[shift]?.username) {
        <button class="print-btn" (click)="printShift(shift)">Print Shift {{ shift }}</button>
      }
    </div>
  }
</div>
