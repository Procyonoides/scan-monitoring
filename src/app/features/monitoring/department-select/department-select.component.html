<div class="wrap">
  <h1>Production Monitoring</h1>
  <p>Pilih departemen untuk membuka layar monitoring.</p>
  <div class="rows">
    @for (row of departmentRows; track row) {
      <div class="row">
        @for (dept of row; track dept) {
          <button (click)="open(dept)">{{ dept }}</button>
        }
      </div>
    }
  </div>
</div>
